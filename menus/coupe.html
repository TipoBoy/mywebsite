<HTML> 

<!-- Black background and inform browser which function to run when page is loaded. -->
<BODY onload="PageLoaded()" BGCOLOR="#000000" >

<SCRIPT language="JavaScript">
<!--
   function PageLoaded()
   {
      LoadImages();

      // Only need to drop down menus on IE.

      if (navigator.appName == "Microsoft Internet Explorer")
         DropDownMenu();
   }

   function DropDownMenu()
   {
      if (complete.style.posTop < 0) {
         complete.style.posTop += 5;

         setTimeout("DropDownMenu()", 1)
      }
   }

   function Pressed() {

      // User pressed a button so give focus to frame called "bar"
      // to remove focus box from button.

      if (document.images) {
         top.bar.focus();
      }
   }

   function TurnOn(imageName, statusBarText) {

      // Displays image and updates status bar with supplied message.

      if (document.images) {

         document["leftarrow_"  + imageName].src = "images/leftsingle.gif";
         document["rightarrow_" + imageName].src = "images/rightsingle.gif";

	 window.status = statusBarText;
      }
   }

   function TurnOff(imageName) {

      // Displays image and clears status bar.

      if (document.images) {
         document["leftarrow_"  + imageName].src = "images/blank.gif";
         document["rightarrow_" + imageName].src = "images/blank.gif";

	 window.status = '';
      }
   }

   function AddRecord(imageName, imageWidth, helpText, linkName)
   {
      var separatorHeight = 5;
      var imageHeight = 13;
      var horizontalPadding = 2;
   
      // Write out html that places the left and right borders of the button
      // with the menu graphic centered in the middle. Also sets up Javascript
      // to run when the mouse moves into and out of the graphic. Initial
      // image is blank and such that when the menu scrolls down it looks
      // complete. Later the real images are loaded and filled in.
      
      document.write("<TR>");
      document.write("<TD width=6>");
      document.write("<img src=\"images/left.gif\" width=6 height=" + (imageHeight + separatorHeight) + ">");
      document.write("</TD>");

      document.write("<TD bgcolor=#820000 width=102>");
      document.write("<center><img name=\"leftarrow_" + imageName + "\" src=\"images/blank.gif\" width=10 height=" + imageHeight + "><img src=\"images/blank.gif\" width=" + horizontalPadding + " height=" + imageHeight + "><a href=\"" + linkName + "\" target=\"body\"");
      document.write("onMouseOver=\"TurnOn('" + imageName + "', '" + helpText + "'); return true;\"");
      document.write("onMouseOut=\"TurnOff('" + imageName + "'); return true;\"");
      document.write("onClick=\"Pressed();\">");
      document.write("<img name=\"" + imageName + "\" alt=\"" + helpText + "\" src=\"images/blank.gif\" width=" + imageWidth + " height=" + imageHeight + " border=0></A><img src=\"images/blank.gif\" width=" + horizontalPadding + " height=" + imageHeight + "><img name=\"rightarrow_" + imageName + "\" src=\"images/blank.gif\" width=10 height=" + imageHeight + "></center>");
      document.write("</center>");
      document.write("</TD>");

      document.write("<TD width=6>");
      document.write("<img src=\"images/right.gif\" width=6 height=" + (imageHeight + separatorHeight) + ">");
      document.write("</TD>");

      document.write("</TR>");

   }

//-->
</SCRIPT>
